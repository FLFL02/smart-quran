<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المصحف الشريف - التتبع الصوتي الذكي</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f9f9f9;
            margin: 0;
            padding: 50px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: auto;
        }
        /* إجبار زر الميكروفون على استقبال الضغطات وقبول الماوس بفاعلية تامة */
        .mic-btn, #micBtn, button {
            pointer-events: auto !important;
            cursor: pointer !important;
            z-index: 99999 !important;
            position: relative !important;
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 50px;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(46, 125, 50, 0.3);
            transition: background 0.3s;
        }
        .mic-btn:hover, #micBtn:hover, button:hover {
            background-color: #1b5e20;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>القرآن الذكي</h1>
        <p>منصة المصحف الذكي والتتبع الصوتي المباشر</p>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
        
        <!-- زر الميكروفون المصلح بحدث تفاعلي مباشر -->
        <button id="micBtn" class="mic-btn">🎙️ اضغط هنا لبدء التتبع الصوتي</button>
        <p id="status" style="margin-top: 15px; color: #666;"></p>
    </div>

    <script>
        // التأكد من تحميل العناصر بالكامل قبل تفعيل الأحداث
        document.addEventListener('DOMContentLoaded', () => {
            const micBtn = document.getElementById('micBtn');
            const statusText = document.getElementById('status');
            
            if (micBtn) {
                micBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    console.log("تم الضغط على زر الميكروفون بنجاح!");
                    statusText.textContent = "جاري تفعيل الميكروفون والاستماع...";
                    statusText.style.color = "#2e7d32";
                    
                    // اختبار واجهة التعرف الصوتي (SpeechRecognition API)
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    if (SpeechRecognition) {
                        const recognition = new SpeechRecognition();
                        recognition.lang = 'ar-SA';
                        recognition.continuous = true;
                        recognition.interimResults = true;
                        
                        recognition.onstart = () => {
                            statusText.textContent = "🎙️ الميكروفون يستمع الآن... اقرأ الآيات";
                        };
                        
                        recognition.onresult = (event) => {
                            const speechResult = event.results[event.results.length - 1][0].transcript;
                            statusText.textContent = "تم التعرف على صوتك: " + speechResult;
                        };
                        
                        recognition.onerror = (event) => {
                            statusText.textContent = "خطأ في الميكروفون: " + event.error;
                            statusText.style.color = "red";
                        };
                        
                        recognition.start();
                    } else {
                        alert("متصفحك لا يدعم خاصية التعرف الصوتي المباشر، جرب استخدام متصفح Google Chrome.");
                    }
                });
            }
        });
    </script>
</body>
</html>
